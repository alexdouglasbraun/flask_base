apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-base
  namespace: flask-base
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask-base
  template:
    metadata:
      labels:
        app: flask-base
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/flask-base:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: flask-base-config
            - secretRef:
                name: flask-base-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
