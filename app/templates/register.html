{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
  <section class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 mb-3">Create account</h1>
          {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
          {% endif %}
          <form method="post" action="{{ url_for('web.auth.register') }}" class="vstack gap-3">
            <div>
              <label class="form-label" for="display_name">Display name</label>
              <input class="form-control" id="display_name" name="display_name" type="text" autocomplete="name" value="{{ display_name or '' }}">
            </div>
            <div>
              <label class="form-label" for="email">Email</label>
              <input class="form-control" id="email" name="email" type="email" autocomplete="email" value="{{ email or '' }}" required>
            </div>
            <div>
              <label class="form-label" for="password">Password</label>
              <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
            </div>
            <div>
              <label class="form-label" for="confirm_password">Confirm password</label>
              <input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Create account</button>
          </form>
          <p class="text-secondary small mt-3 mb-0">
            Already have an account?
            <a href="{{ url_for('web.auth.login') }}">Log in</a>
          </p>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
